<div class="az-content-breadcrumb lh-1 mg-b-2 pl-0">

  <ng-template ngFor let-i="index" let-c="count" let-azListBreadcrumb [ngForOf]="settingAzList.azListBreadcrumbs">
    <span>{{azListBreadcrumb}}</span>
  </ng-template>

</div>


<h2 class="az-content-title tx-24 mg-b-0 pl-0">

  <ng-template [ngIf]="settingAzList.isBack">
    <button mat-icon-button mat-button color="primary" (click)="OnSelectBack()"
      matTooltip="{{settingAzList.toolTipBack}}">
      <mat-icon class="icon-back-4"></mat-icon>
    </button>
  </ng-template>

  <span>
    {{ settingAzList.titleAzLists }}
  </span>

  <span class="float-right">
    <ng-template [ngIf]="settingAzList.isNew">
      <button mat-icon-button mat-button color="primary" (click)="OnSelectNew()"
        matTooltip="{{settingAzList.toolTipNew}}">
        <mat-icon class="icon-add"></mat-icon>
      </button>
    </ng-template>
  </span>

</h2>


<ng-template [ngIf]="settingAzList.activateDropDown">
  <mat-form-field class="w-100">
    <mat-label>{{settingAzList.placeholderDropdown}}</mat-label>
    <mat-select [(ngModel)]="selectAzSelectDropdown">

      <ng-template ngFor let-idropdown [ngForOf]="azListDropdowns" let-i="index">
        <mat-option [value]="idropdown.id" (click)="OnSelectDropdown()">
          {{ idropdown.name}}
        </mat-option>
      </ng-template>

    </mat-select>
  </mat-form-field>
</ng-template>

<ng-template [ngIf]="!settingAzList.activateDropDown">
  <div class=" az-nav-line-chat nav-link active"></div>
</ng-template>




<div id="azContactList" class="az-contacts-list w-100">

  <ng-template ngFor let-i="index" let-c="count" let-azList [ngForOf]="azLists">

    <div class="az-contact-item" [ngClass]="{'selected' : azList === selectAzList}">

      <div *ngIf="!!azList.image" class="az-img-user"><img src="{{azList.image}}" alt=""></div>

      <a href="#" class="az-contact-body" [ngClass]="{'ml-0': !azList.image == true}" (click)="OnSelectAzList(azList)">
        <h6 class="pt-2">
          {{azList.name}}
        </h6>
        <span class="phone" class="mg-0">{{azList.surname}}</span>
      </a><!-- az-contact-body -->

      <div class="az-contact-star">

        <ng-template [ngIf]="settingAzList.activateOptionDelete">
          <button mat-icon-button mat-button (click)="OnSelectDelete(azList)"
            matTooltip="{{settingAzList.toolTipOptionDelete}}">
            <mat-icon class="icon-delete"></mat-icon>
          </button>
        </ng-template>

        <ng-template [ngIf]="settingAzList.activateSelectItemEmit2">

          <button mat-icon-button mat-button (click)="OnSelectItemEmit2(azList)"
            matTooltip="{{settingAzList.toolTipSelectItemEmit2}}" class="pl-2">
            <span class="h6">{{azList.item2}}</span>
            <mat-icon class="{{settingAzList.iconSelectItemEmit2}}"></mat-icon>
          </button>
        </ng-template>

        <ng-template [ngIf]="settingAzList.activateSelectItemEmit3 && (!settingAzList.activateSelectItemEmit2 || azList.item2 > 0)">

          <button mat-icon-button mat-button (click)="OnSelectItemEmit3(azList)"
            matTooltip="{{settingAzList.toolTipSelectItemEmit3}}">
            <span class="h6">{{azList.item3}}</span>
            <mat-icon class="{{settingAzList.iconSelectItemEmit3}}"></mat-icon>
          </button>
        </ng-template>

      </div>

    </div><!-- az-contact-item -->

  </ng-template>
</div><!-- az-contacts-list -->
