<form #form="ngForm" (ngSubmit)="onLogin(form)" class="login-form">
  <mat-card>
    <mat-card-title class="mat-primary">Iniciar Sesión</mat-card-title>
    <mat-card-content>
      
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          minlength="6"
          #emailCtrl="ngModel"
        />
        <mat-error *ngIf="emailCtrl.errors?.['required']">El email es obligatorio</mat-error>
        <mat-error *ngIf="emailCtrl.errors?.['minlength']">Debe tener al menos 6 caracteres</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          #passwordCtrl="ngModel"
        />
        <mat-error *ngIf="passwordCtrl.errors?.['required']">La contraseña es obligatoria</mat-error>
        <mat-error *ngIf="passwordCtrl.errors?.['minlength']">Debe tener al menos 6 caracteres</mat-error>
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Entrar
      </button>
      <button mat-button type="button" (click)="onForgotPassword()">Olvidé mi contraseña</button>
    </mat-card-actions>
  </mat-card>
</form>
