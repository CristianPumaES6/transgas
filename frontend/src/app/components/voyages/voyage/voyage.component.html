<div class="container-fluid pr-4 pt-4 pl-4 pb-0">

  <div class="az-content-left az-content-left-contacts">

    <app-az-list [settingAzList]="SettingAzList" [azLists]="azLists" [azListDropdowns]="azListDropdowns"
      (eSelectAzList)="SelectItemAzList($event)" (eSelectNew)="ClickNew()" (eSelectDelete)="ClickDelete($event)"
      (eSelectDropdown)="ClickSelectUser($event)" (eSelectOption2)="ClickAddPort($event)"
      (eSelectOption3)="ClickAddReport($event)">
    </app-az-list>

  </div><!-- az-content-left -->


  <div class="az-content-body az-content-body-contacts">

    <div class="az-contact-info-header">
      <div class="media">
      </div>
    </div><!-- az-contact-info-header -->
    <div class="az-contact-info-body">

      {{selectVoyage.year}}
      {{selectVoyage.voyageNumber}}
    </div>

  </div>

</div>
